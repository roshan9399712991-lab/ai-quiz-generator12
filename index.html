
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Quiz Generator 12.0</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#10152f,#29215b,#542c85);
 color:white;min-height:100vh;padding:20px;
}
.container{max-width:900px;margin:auto}
header{text-align:center;padding:25px 10px}
header h1{font-size:34px;color:#a9c7ff;margin-bottom:10px}
header p{color:#ddd}
.card{
 background:#ffffff12;border:1px solid #ffffff25;
 padding:25px;border-radius:18px;margin:18px 0;
 backdrop-filter:blur(12px);
}
label{display:block;margin:15px 0 8px;font-weight:bold}
input,select{
 width:100%;padding:13px;border:0;border-radius:9px;
 background:#fff;color:#222;font-size:15px;
}
button{
 border:0;padding:13px 20px;border-radius:9px;
 background:#7655ed;color:white;font-size:16px;
 font-weight:bold;cursor:pointer;margin-top:18px;
}
button:hover{background:#987bff}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{width:100%}
.hidden{display:none}
.question{font-size:20px;line-height:1.5;margin:15px 0}
.option{
 display:block;width:100%;text-align:left;
 background:#ffffff15;border:1px solid #ffffff30;
 padding:14px;margin:10px 0;border-radius:10px;
}
.option.selected{background:#7655ed}
.option.correct{background:#14864c}
.option.wrong{background:#bd354a}
.option:disabled{opacity:1}
.info{color:#c5c5e9;margin-bottom:12px}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.progress{height:9px;background:#ffffff30;border-radius:20px;overflow:hidden;margin:15px 0}
.bar{height:100%;background:#7cdbab;width:0%;transition:.3s}
#feedback{padding:15px;border-radius:10px;margin-top:15px;background:#ffffff15;line-height:1.5}
.result{text-align:center}
.result h2{font-size:30px;color:#91f5bd}
.small{font-size:13px;color:#bbb;margin-top:10px}
#status{margin-top:15px;color:#ffe18b;text-align:center}
@media(max-width:600px){
 header h1{font-size:26px}
 .card{padding:17px}
 .question{font-size:18px}
}
</style>
</head>

<body>
<div class="container">

<header>
 <h1>🧠 AI QUIZ GENERATOR 12.0</h1>
 <p>अपना Topic चुनें और AI से अपना Quiz बनाएं!</p>
</header>

<section class="card" id="setup">
 <h2>⚙️ Quiz Settings</h2>

 <label>Groq API Key</label>
 <input id="apiKey" type="password" placeholder="अपनी Groq API Key डालें">

 <label>Quiz Topic</label>
 <input id="topic" placeholder="जैसे Python, Science, History, Computer">

 <label>Questions की संख्या</label>
 <select id="count">
  <option value="5">5 Questions</option>
  <option value="10" selected>10 Questions</option>
  <option value="15">15 Questions</option>
  <option value="20">20 Questions</option>
 </select>

 <label>Difficulty Level</label>
 <select id="difficulty">
  <option>Easy</option>
  <option selected>Medium</option>
  <option>Hard</option>
 </select>

 <label>Language</label>
 <select id="language">
  <option value="Hindi">Hindi</option>
  <option value="English">English</option>
  <option value="Hinglish">Hinglish</option>
 </select>

 <button class="primary" id="generateBtn" onclick="generateQuiz()">
  ✨ Generate AI Quiz
 </button>
 <p id="status"></p>
 <p class="small">
  API Key: <a href="https://console.groq.com/keys" target="_blank" style="color:#b8c8ff">Get Groq API Key</a>
 </p>
</section>

<section class="card hidden" id="quiz">
 <div class="top">
  <span id="questionNumber">Question 1</span>
  <span id="score">Score: 0</span>
 </div>
 <div class="progress"><div class="bar" id="bar"></div></div>
 <p class="info" id="quizTopic"></p>
 <h3 class="question" id="questionText"></h3>
 <div id="options"></div>
 <div id="feedback" class="hidden"></div>
 <button id="nextBtn" class="primary hidden" onclick="nextQuestion()">Next Question →</button>
</section>

<section class="card hidden result" id="result">
 <h2>🎉 Quiz Completed!</h2>
 <p style="font-size:22px;margin:20px" id="finalScore"></p>
 <p id="percentage"></p>
 <p id="message" style="margin-top:15px"></p>
 <button class="primary" onclick="restartQuiz()">🔄 Play Again</button>
</section>

</div>

<script>
let questions = [];
let current = 0;
let score = 0;
let answered = false;

async function generateQuiz(){
 const apiKey = document.getElementById("apiKey").value.trim();
 const topic = document.getElementById("topic").value.trim();
 const count = Number(document.getElementById("count").value);
 const difficulty = document.getElementById("difficulty").value;
 const language = document.getElementById("language").value;

 if(!apiKey || !topic){
  alert("API Key और Topic दोनों भरें!");
  return;
 }

 const btn = document.getElementById("generateBtn");
 const status = document.getElementById("status");

 btn.disabled = true;
 btn.textContent = "⏳ Generating...";
 status.textContent = "AI आपके लिए Questions बना रहा है...";

 try{
  const prompt = `
Create exactly ${count} multiple choice quiz questions about "${topic}".

Difficulty: ${difficulty}
Language: ${language}

Return ONLY valid JSON. No markdown, no extra text.
Use this exact structure:
{
 "questions":[
  {
   "question":"Question text",
   "options":["Option A","Option B","Option C","Option D"],
   "answer":0,
   "explanation":"Explanation of the correct answer"
  }
 ]
}

Rules:
- Exactly ${count} questions.
- Four options per question.
- answer must be an integer from 0 to 3.
- Questions must be factually correct.
- All content must use ${language}.
- Do not repeat questions.
- Explanation should be short and useful.
`;

  const response = await fetch(
   "https://api.groq.com/openai/v1/chat/completions",
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json",
     "Authorization":"Bearer "+apiKey
    },
    body:JSON.stringify({
     model:"llama-3.3-70b-versatile",
     messages:[
      {role:"system",content:"You are an expert quiz creator. Return valid JSON only."},
      {role:"user",content:prompt}
     ],
     temperature:0.7,
     max_completion_tokens:6000,
     response_format:{type:"json_object"}
    })
   }
  );

  const data = await response.json();

  if(!response.ok){
   throw new Error(data.error?.message || "Groq API request failed");
  }

  const content = data.choices?.[0]?.message?.content;
  if(!content) throw new Error("AI ने कोई उत्तर नहीं दिया।");

  const parsed = JSON.parse(content);
  questions = parsed.questions;

  if(!Array.isArray(questions) || questions.length !== count){
   throw new Error("AI ने सही संख्या में Questions नहीं बनाए। दोबारा कोशिश करें।");
  }

  questions.forEach(q=>{
   if(typeof q.question !== "string" ||
      !Array.isArray(q.options) ||
      q.options.length !== 4 ||
      !Number.isInteger(q.answer) ||
      q.answer < 0 || q.answer > 3){
    throw new Error("AI ने गलत Quiz Format दिया। दोबारा कोशिश करें।");
   }
  });

  current = 0;
  score = 0;
  document.getElementById("setup").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");
  document.getElementById("quizTopic").textContent = "Topic: "+topic;
  showQuestion();

 }catch(error){
  status.textContent = "❌ Error: "+error.message;
 }finally{
  btn.disabled = false;
  btn.textContent = "✨ Generate AI Quiz";
 }
}

function showQuestion(){
 answered = false;
 const q = questions[current];

 document.getElementById("questionNumber").textContent =
  `Question ${current+1} / ${questions.length}`;

 document.getElementById("score").textContent = "Score: "+score;
 document.getElementById("bar").style.width =
  ((current/questions.length)*100)+"%";

 document.getElementById("questionText").textContent = q.question;

 const options = document.getElementById("options");
 options.innerHTML = "";

 document.getElementById("feedback").classList.add("hidden");
 document.getElementById("nextBtn").classList.add("hidden");

 q.options.forEach((option,index)=>{
  const btn = document.createElement("button");
  btn.className = "option";
  btn.textContent = String.fromCharCode(65+index)+". "+option;
  btn.onclick = ()=>checkAnswer(index);
  options.appendChild(btn);
 });
}

function checkAnswer(index){
 if(answered) return;
 answered = true;

 const q = questions[current];
 const buttons = document.querySelectorAll(".option");

 buttons.forEach((btn,i)=>{
  btn.disabled = true;
  if(i===q.answer) btn.classList.add("correct");
  else if(i===index) btn.classList.add("wrong");
 });

 const correct = index === q.answer;
 if(correct) score++;

 document.getElementById("score").textContent = "Score: "+score;

 const feedback = document.getElementById("feedback");
 feedback.classList.remove("hidden");

 feedback.textContent =
  (correct ? "✅ सही जवाब! " : "❌ गलत जवाब! ") +
  "सही उत्तर: "+q.options[q.answer]+
  ". "+(q.explanation || "");

 const next = document.getElementById("nextBtn");
 next.classList.remove("hidden");
 next.textContent = current===questions.length-1 ?
  "🏆 See Result" : "Next Question →";
}

function nextQuestion(){
 current++;
 if(current < questions.length){
  showQuestion();
 }else{
  showResult();
 }
}

function showResult(){
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");

 const percent = Math.round((score/questions.length)*100);

 document.getElementById("finalScore").textContent =
  `${score} / ${questions.length}`;

 document.getElementById("percentage").textContent =
  `Your Score: ${percent}%`;

 document.getElementById("message").textContent =
  percent>=80 ? "🌟 Excellent! बहुत शानदार!" :
  percent>=50 ? "👏 Good Job! और अभ्यास करें।" :
  "💪 अभ्यास करते रहें, आप बेहतर करेंगे!";
}

function restartQuiz(){
 document.getElementById("result").classList.add("hidden");
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("setup").classList.remove("hidden");
 document.getElementById("status").textContent = "";
 questions = [];
 current = 0;
 score = 0;
}
</script>
</body>
</html>
